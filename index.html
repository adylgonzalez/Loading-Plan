<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LOADING PLANS</title>
<style>
body{font-family:Arial;padding:0;background:#f2f2f2;margin:0}
.top{background:#0b6e4f;color:white;padding:14px 12px;text-align:center;position:sticky;top:0;z-index:10}
.top h2{margin:0;font-size:24px;letter-spacing:1px}
.top p{margin:4px 0 10px;font-size:13px;opacity:0.9}
.topBtns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.topBtns button{width:auto;padding:10px 14px;font-size:13px;border-radius:20px}
.btnSaved{background:white;color:#0b6e4f}
.btnSync{background:#1a5276}
.btnAdd{background:#ff9800;color:white}
.wrap{padding:12px}
input,textarea,button,select{width:100%;padding:12px;margin:6px 0;border-radius:8px;border:1px solid #ccc;font-size:16px;box-sizing:border-box}
button{background:#0b6e4f;color:white;border:none;font-weight:bold;cursor:pointer}
.card{background:white;padding:14px;border-radius:12px;margin:12px 0;box-shadow:0 1px 5px #ccc}
.bales{font-size:20px;font-weight:bold;color:#0b6e4f}
.del{background:#c0392b;margin-top:8px}
.small{color:#666;font-size:13px}
.sync{background:#1a5276}
.badge{display:inline-block;background:#e8f5e9;color:#0b6e4f;padding:4px 8px;border-radius:20px;font-size:12px;font-weight:bold}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);z-index:100;overflow:auto}
.modalBox{background:white;margin:15% auto 20px;padding:16px;border-radius:14px;width:92%;max-width:500px;position:relative}
.closeBtn{background:#eee;color:#333;width:40px;position:absolute;right:10px;top:10px;padding:8px}
.row{display:flex;gap:8px}
.row button{flex:1}
.settingsRow{display:flex;gap:6px;align-items:center}
.settingsRow input{flex:1}
.settingsRow button{width:48px}
.eye{background:#666}
</style>
</head>
<body>

<!-- TOP BAR - LOADING PLANS - SAVED FIRST, THEN SYNC -->
<div class="top">
<h2>📦 LOADING PLANS</h2>
<p>2kg = 12 bags | 1kg = 24 bags | 0.5kg = 24 bags</p>
<div class="topBtns">
<button class="btnSaved" onclick="document.getElementById('savedSection').scrollIntoView({behavior:'smooth'})">📋 Saved Formulas</button>
<button class="btnSync" onclick="openModal('syncModal')">☁️ GitHub Sync</button>
<button class="btnAdd" onclick="openModal('addModal')">➕ Add Formula</button>
</div>
<div id="syncStatus" style="font-size:12px;margin-top:8px;opacity:0.9">Not synced yet</div>
</div>

<div class="wrap">

<!-- 1. SAVED FORMULAS FIRST - BEFORE ANYTHING ELSE -->
<div class="card" id="savedSection">
<b>📋 Saved Formulas</b> <span class="badge" id="countBadge">0</span>
<div id="list" style="margin-top:10px"></div>
</div>

<!-- 2. SEARCH AFTER SAVED -->
<div class="card">
<b>🔍 Search Formulas</b>
<input id="search" type="number" placeholder="Search by Bales e.g. 590" oninput="show()">
<select id="searchType" onchange="show()">
<option value="">All Types</option>
<option value="2kg">2kg Bales Only</option>
<option value="1kg">1kg Bales Only</option>
<option value="0.5kg">0.5kg Bales Only</option>
</select>
</div>

</div>

<!-- HIDDEN POPUP 1: GITHUB SYNC -->
<div id="syncModal" class="modal">
<div class="modalBox">
<button class="closeBtn" onclick="closeModal('syncModal')">X</button>
<h3>☁️ GitHub Sync</h3>
<p class="small">Token is hidden •••••• Saved only in this browser</p>
<input id="ghUser" placeholder="GitHub Username" value="adylgonzalez">
<input id="ghRepo" placeholder="Repo Name" value="Loading-Plan">
<div class="settingsRow">
<input id="ghToken" type="password" placeholder="GitHub Token ghp_...">
<button class="eye" onclick="toggleToken()">👁️</button>
</div>
<div class="row">
<button class="sync" onclick="saveSettings()">SAVE & SYNC</button>
<button class="sync" onclick="syncToGitHub()">SYNC NOW</button>
</div>
</div>
</div>

<!-- HIDDEN POPUP 2: ADD FORMULA - NO TOTAL BAGS -->
<div id="addModal" class="modal">
<div class="modalBox">
<button class="closeBtn" onclick="closeModal('addModal')">X</button>
<h3>➕ Add New Formula</h3>
<input id="bales" type="number" placeholder="Total Bales e.g. 590">
<select id="type">
<option value="2kg">Wheat / Maize - 2kg Bale (12 bags)</option>
<option value="1kg">Wheat / Maize - 1kg Bale (24 bags)</option>
<option value="0.5kg">Wheat / Maize - 0.5kg Bale (24 bags)</option>
</select>
<input id="title" placeholder="Formula Name e.g. 590 Bales - Full Truck">
<textarea id="formula" rows="5" placeholder="Write formula... e.g. 40x2 + 50x6 + 45x4 + 30"></textarea>
<button onclick="add()">+ SAVE FORMULA TO GITHUB</button>
</div>
</div>

<script>
let data = [];
let fileSha = null;
function openModal(id){ document.getElementById(id).style.display='block'; }
function closeModal(id){ document.getElementById(id).style.display='none'; }
window.onclick = function(e){ if(e.target.classList.contains('modal')) e.target.style.display='none'; }
function toggleToken(){ let t=document.getElementById('ghToken'); t.type=t.type==='password'?'text':'password'; }
function getSettings(){ return { user: document.getElementById('ghUser').value.trim() || localStorage.getItem('ghUser') || '', repo: document.getElementById('ghRepo').value.trim() || 'Loading-Plan', token: document.getElementById('ghToken').value.trim() || localStorage.getItem('ghToken') || '' }; }
function saveSettings(){ let s=getSettings(); localStorage.setItem('ghUser',s.user); localStorage.setItem('ghRepo',s.repo); localStorage.setItem('ghToken',s.token); loadFromGitHub(); closeModal('syncModal'); }
function loadSettings(){ document.getElementById('ghUser').value=localStorage.getItem('ghUser')||'adylgonzalez'; document.getElementById('ghRepo').value=localStorage.getItem('ghRepo')||'Loading-Plan'; document.getElementById('ghToken').value=localStorage.getItem('ghToken')||''; }
async function loadFromGitHub(){ let s=getSettings(); if(!s.user||!s.token){ document.getElementById('syncStatus').innerText='Fill GitHub Sync to connect'; show(); return; } document.getElementById('syncStatus').innerText='Loading from GitHub...'; try{ let res=await fetch(`https://api.github.com/repos/${s.user}/${s.repo}/contents/formulas.json`,{headers:{Authorization:'token '+s.token,Accept:'application/vnd.github.v3+json'}}); if(!res.ok) throw new Error('File not found. Create formulas.json with []'); let json=await res.json(); fileSha=json.sha; data=JSON.parse(atob(json.content.replace(/\n/g,''))); localStorage.setItem('flourBalesV3',JSON.stringify(data)); document.getElementById('syncStatus').innerText='✅ Synced: '+data.length+' formulas'; show(); }catch(e){ document.getElementById('syncStatus').innerText='❌ '+e.message; show(); } }
async function syncToGitHub(){ let s=getSettings(); if(!s.user||!s.token){ alert('Fill GitHub settings first'); return; } document.getElementById('syncStatus').innerText='Uploading...'; try{ let getRes=await fetch(`https://api.github.com/repos/${s.user}/${s.repo}/contents/formulas.json`,{headers:{Authorization:'token '+s.token}}); let getJson=await getRes.json(); fileSha=getJson.sha; let content=btoa(unescape(encodeURIComponent(JSON.stringify(data,null,2)))); let res=await fetch(`https://api.github.com/repos/${s.user}/${s.repo}/contents/formulas.json`,{method:'PUT',headers:{Authorization:'token '+s.token,Accept:'application/vnd.github.v3+json'},body:JSON.stringify({message:'Update formulas '+new Date().toISOString(),content:content,sha:fileSha})}); if(!res.ok) throw new Error('GitHub rejected. Check token'); let j=await res.json(); fileSha=j.content.sha; document.getElementById('syncStatus').innerText='✅ Saved to GitHub!'; closeModal('syncModal'); }catch(e){ document.getElementById('syncStatus').innerText='❌ '+e.message; alert(e.message); } }
async function add(){ let b=document.getElementById('bales').value; let ty=document.getElementById('type').value; let label=document.getElementById('type').options[document.getElementById('type').selectedIndex].text; let t=document.getElementById('title').value; let f=document.getElementById('formula').value; if(!b||!t||!f){ alert('Fill all fields'); return; } data.push({bales:b,type:ty,typeLabel:label,title:t,formula:f}); localStorage.setItem('flourBalesV3',JSON.stringify(data)); show(); await syncToGitHub(); document.getElementById('bales').value=''; document.getElementById('title').value=''; document.getElementById('formula').value=''; closeModal('addModal'); }
function show(){ let q=document.getElementById('search').value; let qt=document.getElementById('searchType').value; let filtered=data.filter(d=>(!q||d.bales==q)&&(!qt||d.type==qt)); document.getElementById('countBadge').innerText=data.length+' saved'; let html=''; if(filtered.length==0) html='<p>No formula found. Click ➕ Add Formula above.</p>'; filtered.forEach((d)=>{ let idx=data.indexOf(d); html+=`<div class="card" style="box-shadow:none;border:1px solid #eee"><div class="bales">${d.bales} BALES - ${d.type}</div><div class="small">${d.typeLabel}</div><b>${d.title}</b><p style="white-space:pre-wrap">${d.formula}</p><button class="del" onclick="del(${idx})">Delete</button></div>`; }); document.getElementById('list').innerHTML=html; }
async function del(index){ if(confirm('Delete this?')){ data.splice(index,1); localStorage.setItem('flourBalesV3',JSON.stringify(data)); show(); await syncToGitHub(); } }
loadSettings();
let local=JSON.parse(localStorage.getItem('flourBalesV3')||'null');
if(local&&local.length>0){ data=local; } else { data=[{bales:"590",type:"2kg",typeLabel:"Wheat / Maize - 2kg Bale (12 bags)",title:"590 Bales - Full Load",formula:"40 x 2 = 80\n50 x 6 = 300\n45 x 4 = 180\n+ 30 = 590 BALES"}]; }
show();
if(localStorage.getItem('ghUser')) loadFromGitHub();
</script>
</body>
</html>
