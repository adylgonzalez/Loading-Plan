<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flour Loading - Bales</title>
<style>
body{font-family:Arial;padding:12px;background:#f2f2f2;margin:0}
.top{background:#0b6e4f;color:white;padding:14px;border-radius:0 0 12px 12px;text-align:center}
.top h2{margin:0;font-size:22px}
.top p{margin:4px 0 0;font-size:13px;opacity:0.9}
input,textarea,button,select{width:100%;padding:12px;margin:6px 0;border-radius:8px;border:1px solid #ccc;font-size:16px;box-sizing:border-box}
button{background:#0b6e4f;color:white;border:none;font-weight:bold;cursor:pointer}
button:active{opacity:0.85}
.card{background:white;padding:14px;border-radius:12px;margin:12px 0;box-shadow:0 1px 5px #ccc}
.bales{font-size:20px;font-weight:bold;color:#0b6e4f}
.del{background:#c0392b;margin-top:8px}
.small{color:#666;font-size:13px}
.calc{background:#e8f5e9;padding:10px;border-radius:8px;margin:6px 0;font-weight:bold}
.sync{background:#1a5276}
.sectionTitle{font-size:18px;font-weight:bold;margin:0;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.arrow{font-size:14px;color:#666}
.hidden{display:none}
.row{display:flex;gap:8px}
.row button{flex:1}
.eye{background:#666}
.settingsRow{display:flex;gap:6px;align-items:center}
.settingsRow input{flex:1}
.settingsRow button{width:48px;padding:12px 0}
.badge{display:inline-block;background:#e8f5e9;color:#0b6e4f;padding:4px 8px;border-radius:20px;font-size:12px;font-weight:bold}
</style>
</head>
<body>

<div class="top">
<h2>🌾 Flour Loading - Bales</h2>
<p>2kg = 12 bags &nbsp;|&nbsp; 1kg = 24 bags &nbsp;|&nbsp; 0.5kg = 24 bags</p>
</div>

<!-- 1. GITHUB SYNC - ON TOP, COLLAPSIBLE & TOKEN HIDDEN -->
<div class="card">
<div class="sectionTitle" onclick="toggle('settingsBody')">☁️ GitHub Sync <span class="arrow" id="settingsArrow">▼ Hide</span></div>
<div id="settingsBody">
<p class="small" style="margin:8px 0">Fill once. Token is hidden and saved only in this browser.</p>
<input id="ghUser" placeholder="GitHub Username" value="adylgonzalez">
<input id="ghRepo" placeholder="Repo Name" value="Loading-Plan">
<div class="settingsRow">
<input id="ghToken" type="password" placeholder="GitHub Token ghp_...">
<button class="eye" onclick="toggleToken()">👁️</button>
</div>
<div class="row">
<button class="sync" onclick="saveSettings()">SAVE & SYNC</button>
<button class="sync" onclick="syncToGitHub()">☁️ SYNC NOW</button>
</div>
<div id="syncStatus" class="small" style="margin-top:6px">Not synced yet</div>
<button onclick="toggle('settingsBody')" style="background:#eee;color:#333;margin-top:6px">Hide Settings ↑</button>
</div>
</div>

<!-- 2. SEARCH -->
<div class="card">
<div class="sectionTitle">🔍 Search Formulas</div>
<input id="search" type="number" placeholder="Search by Bales e.g. 590" oninput="show()">
<select id="searchType" onchange="show()">
<option value="">All Types</option>
<option value="2kg">2kg Bales Only</option>
<option value="1kg">1kg Bales Only</option>
<option value="0.5kg">0.5kg Bales Only</option>
</select>
</div>

<!-- 3. ADD NEW FORMULA - ORGANIZED -->
<div class="card">
<div class="sectionTitle" onclick="toggle('addBody')">➕ Add New Formula <span class="arrow" id="addArrow">▼</span></div>
<div id="addBody">
<input id="bales" type="number" placeholder="Total Bales e.g. 590" oninput="calc()">
<select id="type" onchange="calc()">
<option value="2kg">Wheat / Maize - 2kg Bale (12 bags)</option>
<option value="1kg">Wheat / Maize - 1kg Bale (24 bags)</option>
<option value="0.5kg">Wheat / Maize - 0.5kg Bale (24 bags)</option>
</select>
<input id="title" placeholder="Formula Name e.g. 590 Bales - Full Truck">
<textarea id="formula" rows="4" placeholder="Write formula... e.g. 40x2 + 50x6 + 45x4 + 30"></textarea>
<div id="calcBox" class="calc">Enter bales to see total bags</div>
<button onclick="add()">+ SAVE FORMULA TO GITHUB</button>
</div>
</div>

<!-- 4. SAVED -->
<div class="card">
<div class="sectionTitle">📋 Saved Formulas <span class="badge" id="countBadge">0</span></div>
<div id="list" style="margin-top:10px"></div>
</div>

<script>
let data = [];
let fileSha = null;

function toggle(id){
  let el = document.getElementById(id);
  el.classList.toggle('hidden');
  if(id=='settingsBody') document.getElementById('settingsArrow').innerText = el.classList.contains('hidden') ? '▶ Show' : '▼ Hide';
  if(id=='addBody') document.getElementById('addArrow').innerText = el.classList.contains('hidden') ? '▶' : '▼';
}
function toggleToken(){
  let t = document.getElementById('ghToken');
  t.type = t.type === 'password' ? 'text' : 'password';
}
function getSettings(){
  return {
    user: document.getElementById('ghUser').value.trim() || localStorage.getItem('ghUser') || '',
    repo: document.getElementById('ghRepo').value.trim() || 'Loading-Plan',
    token: document.getElementById('ghToken').value.trim() || localStorage.getItem('ghToken') || ''
  };
}
function saveSettings(){
  let s = getSettings();
  localStorage.setItem('ghUser', s.user);
  localStorage.setItem('ghRepo', s.repo);
  localStorage.setItem('ghToken', s.token);
  loadFromGitHub();
  // Auto-hide after saving to keep it clean
  setTimeout(()=>{ let b=document.getElementById('settingsBody'); if(!b.classList.contains('hidden')) toggle('settingsBody'); }, 800);
}
function loadSettings(){
  document.getElementById('ghUser').value = localStorage.getItem('ghUser') || 'adylgonzalez';
  document.getElementById('ghRepo').value = localStorage.getItem('ghRepo') || 'Loading-Plan';
  document.getElementById('ghToken').value = localStorage.getItem('ghToken') || '';
}
async function loadFromGitHub(){
  let s = getSettings();
  if(!s.user || !s.token){ document.getElementById('syncStatus').innerText = 'Fill GitHub username + token, then Sync'; show(); return; }
  document.getElementById('syncStatus').innerText = 'Loading from GitHub...';
  try{
    let res = await fetch(`https://api.github.com/repos/${s.user}/${s.repo}/contents/formulas.json`, { headers: { Authorization: 'token ' + s.token, Accept: 'application/vnd.github.v3+json' }});
    if(!res.ok) throw new Error('File not found. Create formulas.json with []');
    let json = await res.json();
    fileSha = json.sha;
    let content = atob(json.content.replace(/\n/g,''));
    data = JSON.parse(content);
    localStorage.setItem('flourBalesV3', JSON.stringify(data));
    document.getElementById('syncStatus').innerText = '✅ Synced: ' + data.length + ' formulas';
    show();
  }catch(e){ document.getElementById('syncStatus').innerText = '❌ ' + e.message + ' - Using local data'; show(); }
}
async function syncToGitHub(){
  let s = getSettings();
  if(!s.user || !s.token){ alert('Fill GitHub settings first'); return; }
  document.getElementById('syncStatus').innerText = 'Uploading to GitHub...';
  try{
    let getRes = await fetch(`https://api.github.com/repos/${s.user}/${s.repo}/contents/formulas.json`, { headers: { Authorization: 'token ' + s.token }});
    let getJson = await getRes.json();
    fileSha = getJson.sha;
    let content = btoa(unescape(encodeURIComponent(JSON.stringify(data, null, 2))));
    let res = await fetch(`https://api.github.com/repos/${s.user}/${s.repo}/contents/formulas.json`, {
      method: 'PUT',
      headers: { Authorization: 'token ' + s.token, Accept: 'application/vnd.github.v3+json' },
      body: JSON.stringify({ message: 'Update formulas ' + new Date().toISOString(), content: content, sha: fileSha })
    });
    if(!res.ok) throw new Error('GitHub rejected. Check token has repo permission');
    let j = await res.json();
    fileSha = j.content.sha;
    document.getElementById('syncStatus').innerText = '✅ Saved to GitHub! Open on other device and press Sync.';
  }catch(e){ document.getElementById('syncStatus').innerText = '❌ Upload failed: ' + e.message; alert(e.message); }
}
function bagsPerBale(type){ if(type=="2kg") return 12; if(type=="1kg") return 24; if(type=="0.5kg") return 24; return 12; }
function calc(){ let b=document.getElementById('bales').value; let ty=document.getElementById('type').value; if(b){ let per=bagsPerBale(ty); document.getElementById('calcBox').innerHTML = b + " Bales of " + ty + " = " + (b*per) + " bags total"; } }
async function add(){
  let b=document.getElementById('bales').value; let ty=document.getElementById('type').value; let label=document.getElementById('type').options[document.getElementById('type').selectedIndex].text; let t=document.getElementById('title').value; let f=document.getElementById('formula').value; if(!b||!t||!f){ alert('Fill all fields'); return; }
  let per=bagsPerBale(ty); let auto="\n\nTotal Bags: "+b+" x "+per+" = "+(b*per)+" bags of "+ty;
  data.push({bales:b,type:ty,typeLabel:label,title:t,formula:f+auto});
  localStorage.setItem('flourBalesV3', JSON.stringify(data));
  show();
  await syncToGitHub();
  document.getElementById('bales').value=''; document.getElementById('title').value=''; document.getElementById('formula').value='';
}
function show(){
  let q=document.getElementById('search').value; let qt=document.getElementById('searchType').value;
  let filtered=data.filter(d=>(!q||d.bales==q)&&(!qt||d.type==qt));
  document.getElementById('countBadge').innerText = data.length + ' saved';
  let html=''; if(filtered.length==0) html='<p>No formula found. Add one above.</p>';
  filtered.forEach((d)=>{ let idx=data.indexOf(d); html+=`<div class="card" style="box-shadow:none;border:1px solid #eee"><div class="bales">${d.bales} BALES - ${d.type}</div><div class="small">${d.typeLabel}</div><b>${d.title}</b><p style="white-space:pre-wrap">${d.formula}</p><button class="del" onclick="del(${idx})">Delete</button></div>`; });
  document.getElementById('list').innerHTML=html;
}
async function del(index){ if(confirm('Delete this?')){ data.splice(index,1); localStorage.setItem('flourBalesV3', JSON.stringify(data)); show(); await syncToGitHub(); } }

loadSettings();
let local = JSON.parse(localStorage.getItem('flourBalesV3') || 'null');
if(local && local.length>0){ data = local; } else { data = [{bales:"590", type:"2kg", typeLabel:"Wheat / Maize - 2kg Bale (12 bags)", title:"590 Bales - Full Load", formula:"40 x 2 = 80\n50 x 6 = 300\n45 x 4 = 180\n+ 30 = 590 BALES\n\nTotal Bags: 590 x 12 = 7,080 bags of 2kg\n\nBreakdown: 40x2 + 50x6 + 45x4 + 30"}]; }
show();
if(localStorage.getItem('ghUser')) loadFromGitHub();
</script>
</body>
</html>
