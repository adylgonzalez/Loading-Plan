<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LOADING PLANS</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b6e4f">
<style>
body{font-family:Arial;padding:0;background:#f2f2f2;margin:0}
.top{background:#0b6e4f;color:white;padding:14px 12px;text-align:center;position:sticky;top:0;z-index:10}
.top h2{margin:0;font-size:24px}.topBtns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.topBtns button{width:auto;padding:10px 12px;font-size:12px;border-radius:20px}
.btnSaved{background:white;color:#0b6e4f}.btnSync{background:#1a5276}.btnAdd{background:#333;color:white}.btnDate{background:#ff9800;color:white}.btnUnfinished{background:#c0392b;color:white}
.wrap{padding:12px}input,textarea,button,select{width:100%;padding:12px;margin:6px 0;border-radius:8px;border:1px solid #ccc;font-size:16px;box-sizing:border-box}
button{background:#0b6e4f;color:white;border:none;font-weight:bold;cursor:pointer}
.card{background:white;padding:14px;border-radius:12px;margin:12px 0;box-shadow:0 1px 5px #ccc}
.card.unfinished{border:2px solid #ff9800;border-left:8px solid #ff9800}
.bales{font-size:19px;font-weight:bold;color:#0b6e4f}.plate{font-size:15px;font-weight:bold;background:#0b6e4f;color:white;display:inline-block;padding:3px 8px;border-radius:6px;margin:2px}
.del{background:#c0392b}.editBtn{background:#ff9800}.doneBtn{background:#0b6e4f}.undoBtn{background:#666}.small{color:#666;font-size:13px}.sync{background:#1a5276}
.badge{display:inline-block;background:#e8f5e9;color:#0b6e4f;padding:4px 8px;border-radius:20px;font-size:12px;font-weight:bold}
.unfinishedBadge{background:#ff9800;color:white;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:bold}.doneBadge{background:#0b6e4f;color:white;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:bold}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.6);z-index:100;overflow:auto}
.modalBox{background:white;margin:5% auto 20px;padding:16px;border-radius:14px;width:92%;max-width:560px;position:relative}
.closeBtn{background:#eee;color:#333;width:40px;position:absolute;right:10px;top:10px;padding:8px}
.row{display:flex;gap:8px}.row button{flex:1}.settingsRow{display:flex;gap:6px;align-items:center}.settingsRow input{flex:1}.settingsRow button{width:48px}.eye{background:#666}
.dateBtn{background:#fff3cd;color:#333;border:1px solid #ff9800;text-align:left}.dateBtn.active{background:#ff9800;color:white}
.calcPreview{background:#e8f5e9;padding:10px;border-radius:8px;font-weight:bold;margin:6px 0}.calcPreview.bad{background:#fde8e8;color:#c0392b}
.editingBanner{background:#fff3cd;border:1px solid #ff9800;padding:10px;border-radius:8px;font-weight:bold;margin:6px 0;display:none}
.sectionLabel{font-size:12px;font-weight:bold;color:#0b6e4f;margin-top:10px;text-transform:uppercase}
.formulaSelect{background:#fff3cd;border:1px solid #ff9800;font-weight:bold}
</style>
</head>
<body>
<div class="top"><h2>📦 LOADING PLANS</h2><p>2kg = 12 bags | 1kg = 24 bags | 0.5kg = 24 bags</p><div class="topBtns"><button class="btnAdd" onclick="openAdd()">➕ Add Formula</button><button class="btnSaved" onclick="openModal('savedModal')">📋 Saved Formulas</button><button class="btnDate" onclick="openModal('dateModal')">📅 By Date</button><button class="btnUnfinished" onclick="showOnlyUnfinished()">⏳ Unfinished <span id="unfTop">0</span></button><button class="btnSync" onclick="openModal('syncModal')">☁️ GitHub Sync</button></div><div id="syncStatus" style="font-size:12px;margin-top:8px">Ready</div></div>
<div class="wrap">
<div class="card"><b>🔍 Search Plate / Formula</b><input id="search" placeholder="e.g. KDQ 076M" oninput="show()"><select id="statusFilter" onchange="show()"><option value="">All Status</option><option value="unfinished">⏳ Unfinished Only</option><option value="done">✅ Done Only</option></select><button style="background:#ff9800" onclick="cleanup()">🧹 Clean Duplicates Now</button></div>
<div class="card" id="searchCard" style="display:none;border:2px solid #0b6e4f"><b>🎯 Results</b><div id="searchResults"></div><button style="background:#eee;color:#333" onclick="clearSearch()">Clear X</button></div>
</div>
<div id="dateModal" class="modal"><div class="modalBox"><button class="closeBtn" onclick="closeModal('dateModal')">X</button><h3>📅 By Date</h3><div id="dateList"></div><div id="dateResults"></div></div></div>
<div id="savedModal" class="modal"><div class="modalBox"><button class="closeBtn" onclick="closeModal('savedModal')">X</button><h3>📋 Saved <span class="badge" id="countBadge">0</span> <span class="unfinishedBadge" id="unfBadge">0 unfinished</span></h3><div id="list"></div></div></div>
<div id="syncModal" class="modal"><div class="modalBox"><button class="closeBtn" onclick="closeModal('syncModal')">X</button><h3>☁️ GitHub Sync</h3><input id="ghUser" value="adylgonzalez"><input id="ghRepo" value="Loading-Plan"><div class="settingsRow"><input id="ghToken" type="password" placeholder="GitHub Token ghp_..."><button class="eye" onclick="toggleToken()">👁️</button></div><div class="row"><button class="sync" onclick="saveSettings()">SAVE & SYNC</button><button class="sync" onclick="push()">SYNC NOW</button></div><button style="background:#c0392b" onclick="resetAll()">⚠️ RESET ALL - Delete Everything + Start Clean</button></div></div>
<div id="addModal" class="modal"><div class="modalBox"><button class="closeBtn" onclick="closeModal('addModal');cancelEdit()">X</button><h3 id="addTitle">➕ Add New Formula</h3><div id="editingBanner" class="editingBanner" style="display:none"></div><div class="sectionLabel">1. Bales</div><input id="bales" type="number" placeholder="e.g. 1150" oninput="preview();updateDrop()"><select id="savedSel" class="formulaSelect" onchange="pickSaved()"><option value="">-- Enter Bales First --</option></select><div class="sectionLabel">2. Type</div><select id="type"><option value="2kg">2kg Only</option><option value="1kg">1kg Only</option><option value="0.5kg">0.5kg Only</option><option value="All">All</option></select><div class="sectionLabel">3. Formula</div><input id="title" placeholder="Formula Name"><textarea id="formula" rows="3" placeholder="40+45*4+50*20" oninput="preview()"></textarea><div id="calcPreview" class="calcPreview">Enter bales + formula</div><div class="sectionLabel">4. Car</div><input id="plate" placeholder="Number Plate"><input id="date" type="date"><input id="bay" placeholder="Bay"><input id="invoice" placeholder="Invoice"><select id="status"><option value="unfinished">⏳ Unfinished</option><option value="done">✅ Done</option></select><button id="saveBtn" onclick="saveOne()">+ SAVE FORMULA</button><button id="cancelBtn" style="background:#eee;color:#333;display:none" onclick="cancelEdit()">Cancel Edit</button></div></div>
<script>
let data=[], fileSha=null, editingKey=null, selectedDate='';
function norm(s){return (s||'').toLowerCase().replace(/\s+/g,'').replace(/x/g,'*')}
function stableKey(d){ return ((d.plate||'').toUpperCase().trim())+'|'+(d.bales||'')+'|'+norm(d.formula)+'|'+(d.date||'')+'|'+(d.type||'') }
function fmtDate(d){if(!d)return'';try{return new Date(d+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}catch(e){return d}}
function openModal(id){document.getElementById(id).style.display='block'; if(id=='dateModal') showDates(selectedDate)}
function closeModal(id){document.getElementById(id).style.display='none'}
window.onclick=e=>{if(e.target.classList.contains('modal')) e.target.style.display='none'}
function toggleToken(){let t=document.getElementById('ghToken'); t.type=t.type=='password'?'text':'password'}
function getSettings(){return {user:document.getElementById('ghUser').value.trim()||'adylgonzalez', repo:document.getElementById('ghRepo').value.trim()||'Loading-Plan', token:document.getElementById('ghToken').value.trim()||localStorage.getItem('ghToken')||''}}
function saveSettings(){let s=getSettings(); localStorage.setItem('ghUser',s.user); localStorage.setItem('ghRepo',s.repo); localStorage.setItem('ghToken',s.token); closeModal('syncModal'); pull()}
function loadSettings(){document.getElementById('ghUser').value=localStorage.getItem('ghUser')||'adylgonzalez'; document.getElementById('ghRepo').value=localStorage.getItem('ghRepo')||'Loading-Plan'; document.getElementById('ghToken').value=localStorage.getItem('ghToken')||''}
function setStatus(m){document.getElementById('syncStatus').innerText=m}
function saveLocal(){localStorage.setItem('flourData', JSON.stringify({formulas:data}))}
function cleanup(){
  let seen=new Set(), out=[];
  data.forEach(d=>{ let k=stableKey(d); if(!seen.has(k)){seen.add(k); d.id=k; out.push(d)} });
  let removed=data.length-out.length; data=out; saveLocal(); show(); push();
  alert(removed==0 ? '✅ No duplicates - already clean' : '🧹 Removed '+removed+' duplicate(s)');
}
// GITHUB - Pull replaces local, no merging = no duplicates ever
async function pull(){
  let s=getSettings(); if(!s.token) return;
  try{
    let r=await fetch(`https://api.github.com/repos/${s.user}/${s.repo}/contents/formulas.json`,{headers:{Authorization:'token '+s.token}});
    if(!r.ok) throw new Error('no file');
    let j=await r.json(); fileSha=j.sha;
    let all=JSON.parse(atob(j.content.replace(/\n/g,'')));
    let gd=all.formulas||[];
    // Dedupe by stableKey
    let map=new Map(); gd.forEach(g=>{ g.id=stableKey(g); if(!g.status) g.status='unfinished'; map.set(g.id,g) });
    data=[...map.values()]; saveLocal(); setStatus('✅ Synced: '+data.length); show();
  }catch(e){ setStatus('📴 Using phone copy'); show() }
}
async function push(){
  let s=getSettings(); if(!s.token) return;
  try{
    let gr=await fetch(`https://api.github.com/repos/${s.user}/${s.repo}/contents/formulas.json`,{headers:{Authorization:'token '+s.token}});
    if(gr.ok) fileSha=(await gr.json()).sha;
    let content=btoa(unescape(encodeURIComponent(JSON.stringify({formulas:data},null,2))));
    let body={message:'Update '+new Date().toISOString(), content}; if(fileSha) body.sha=fileSha;
    let r=await fetch(`https://api.github.com/repos/${s.user}/${s.repo}/contents/formulas.json`,{method:'PUT',headers:{Authorization:'token '+s.token},body:JSON.stringify(body)});
    if(!r.ok) throw new Error('rejected');
    fileSha=(await r.json()).content.sha; setStatus('✅ Saved to GitHub + Phone');
  }catch(e){ setStatus('📴 Saved on phone only') }
}
function resetAll(){ if(!confirm('Delete ALL formulas on phone + GitHub?')) return; data=[]; saveLocal(); show(); push(); alert('Cleared. Add fresh now.'); }
function calcTotal(f){
  if(!f) return null; let lines=f.split('\n').map(l=>l.trim()).filter(l=>l); if(!lines.length) return null;
  let total=0, valid=0;
  for(let line of lines){ let ex=line.split('=')[0].toLowerCase().replace(/x/g,'*').replace(/[^0-9+\-*/().]/g,''); if(!ex||!/[0-9]/.test(ex)) continue; try{ let v=Function('"use strict";return ('+ex+')')(); if(typeof v=='number'&&isFinite(v)){total+=v; valid++} }catch(e){return null} }
  return valid?total:null;
}
function preview(){ let b=document.getElementById('bales').value, f=document.getElementById('formula').value, box=document.getElementById('calcPreview'); if(!b||!f){box.innerHTML='Enter bales + formula'; box.className='calcPreview'; return} let t=calcTotal(f); if(t===null){box.innerHTML='Could not calculate'; box.className='calcPreview bad'; return} box.innerHTML = Math.abs(t-parseFloat(b))<0.01 ? '✅ Formula = '+t+' | Bales = '+b+' - MATCHES' : '❌ Formula = '+t+' | Bales = '+b+' - DOES NOT MATCH'; box.className = Math.abs(t-parseFloat(b))<0.01 ? 'calcPreview' : 'calcPreview bad'; }
function updateDrop(){ let b=document.getElementById('bales').value.trim(), sel=document.getElementById('savedSel'); if(!b){sel.innerHTML='<option value="">-- Enter Bales First --</option>'; return} let seen=new Map(); data.filter(d=>d.bales==b).forEach(d=>{let k=norm(d.formula)+'|'+d.type; if(!seen.has(k)) seen.set(k,d)}); let u=[...seen.values()]; if(!u.length){sel.innerHTML='<option value="__new__">➕ Add New for '+b+'</option>'; return} sel.innerHTML='<option value="">-- Pick saved for '+b+' --</option>'+u.map(d=>`<option value="${d.formula.replace(/"/g,'&quot;')}">${d.title} | ${d.type} | ${d.formula}</option>`).join('')+'<option value="__new__">➕ Add New Instead</option>'; }
function pickSaved(){ let sel=document.getElementById('savedSel'); if(sel.value=='__new__'){document.getElementById('title').value=''; document.getElementById('formula').value=''; sel.value=''; preview(); return} if(sel.value){ let f=data.find(d=>d.formula==sel.value); document.getElementById('formula').value=sel.value; if(f){document.getElementById('title').value=f.title; document.getElementById('type').value=f.type} preview(); } }
function group(list){ let m=new Map(); list.forEach(d=>{ let k=d.bales+'|'+(d.type||'')+'|'+norm(d.formula); if(!m.has(k)) m.set(k,{key:k,sample:d,items:[]}); m.get(k).items.push(d) }); let g=[...m.values()]; g.forEach(x=>{ x.items.sort((a,b)=>((a.status||'unfinished')=='unfinished'?0:1)-((b.status||'unfinished')=='unfinished'?0:1)); x.unf=x.items.filter(i=>(i.status||'unfinished')=='unfinished').length }); g.sort((a,b)=>b.unf-a.unf); return g; }
function cardHTML(g, expanded){
  let d=g.sample, unf=g.unf, count=g.items.length;
  let plates=[...new Set(g.items.map(x=>x.plate))].map(p=>`<span class="plate">${p}</span>`).join(' ');
  let status = unf>0 ? `<span class="unfinishedBadge">⏳ ${unf} Unfinished</span>` : `<span class="doneBadge">✅ All Done (${count})</span>`;
  let details='';
  if(expanded){ details=g.items.map(it=>{ let st=it.status||'unfinished'; return `<div style="border:1px solid #eee;padding:8px;border-radius:8px;margin:4px 0"><b>${it.plate}</b> ${it.dateDisplay?'📅 '+it.dateDisplay:''} ${st=='unfinished'?'<span class="unfinishedBadge">⏳ Unfinished</span>':'<span class="doneBadge">✅ Done</span>'}<br><div class="row">${st=='unfinished'?`<button class="doneBtn" onclick="markDone('${encodeURIComponent(it.id)}')">✅ Mark Done</button>`:`<button class="undoBtn" onclick="markUnf('${encodeURIComponent(it.id)}')">↩️ Mark Unfinished</button>`}<button class="editBtn" onclick="editOne('${encodeURIComponent(it.id)}')">✏️ Edit</button><button class="del" onclick="delOne('${encodeURIComponent(it.id)}')">Delete</button></div></div>` }).join(''); }
  return `<div class="card ${unf>0?'unfinished':''}"><div class="bales">${d.bales} BALES - ${d.type}</div><b>${d.title}</b><p style="white-space:pre-wrap">${d.formula}</p>${status} <span class="small">${count} car(s)</span><div style="margin:8px 0">${plates}</div>${details}<div class="row"><button style="background:#eee;color:#333" onclick="toggleG('${encodeURIComponent(g.key)}')">${expanded?'Hide ▲':'Show / Mark Done ▼'}</button>${unf>0?`<button class="doneBtn" onclick="markGroup('${encodeURIComponent(g.key)}')">✅ Mark All Done</button>`:''}</div></div>`;
}
let openGroups=new Set();
function toggleG(k){ k=decodeURIComponent(k); if(openGroups.has(k)) openGroups.delete(k); else openGroups.add(k); show(); }
function findByKey(k){ return data.findIndex(d=>d.id==k) }
function markDone(enc){ let i=findByKey(decodeURIComponent(enc)); if(i<0) return; data[i].status='done'; saveLocal(); show(); push(); }
function markUnf(enc){ let i=findByKey(decodeURIComponent(enc)); if(i<0) return; data[i].status='unfinished'; saveLocal(); show(); push(); }
function markGroup(enc){ let key=decodeURIComponent(enc); let g=group(data).find(x=>x.key==key); if(!g) return; g.items.forEach(it=>{ let idx=findByKey(it.id); if(idx>=0) data[idx].status='done' }); saveLocal(); show(); push(); }
function delOne(enc){ let i=findByKey(decodeURIComponent(enc)); if(i<0) return; data.splice(i,1); saveLocal(); show(); push(); }
function openAdd(){ editingKey=null; document.getElementById('addTitle').innerText='➕ Add New Formula'; document.getElementById('editingBanner').style.display='none'; document.getElementById('saveBtn').innerText='+ SAVE FORMULA'; document.getElementById('cancelBtn').style.display='none'; ['bales','title','formula','plate','bay','invoice','date'].forEach(id=>document.getElementById(id).value=''); document.getElementById('type').value='2kg'; document.getElementById('status').value='unfinished'; updateDrop(); openModal('addModal'); }
function editOne(enc){ let i=findByKey(decodeURIComponent(enc)); if(i<0) return; let d=data[i]; editingKey=d.id; closeModal('savedModal'); closeModal('dateModal'); document.getElementById('addTitle').innerText='✏️ Edit Formula'; document.getElementById('editingBanner').style.display='block'; document.getElementById('editingBanner').innerText='Editing: '+d.title+' - '+d.plate; document.getElementById('saveBtn').innerText='💾 UPDATE'; document.getElementById('cancelBtn').style.display='block'; document.getElementById('bales').value=d.bales; document.getElementById('type').value=d.type; document.getElementById('title').value=d.title; document.getElementById('formula').value=d.formula; document.getElementById('plate').value=d.plate; document.getElementById('date').value=d.date||''; document.getElementById('bay').value=d.bay||''; document.getElementById('invoice').value=d.invoice||''; document.getElementById('status').value=d.status||'unfinished'; updateDrop(); openModal('addModal'); preview(); }
function cancelEdit(){ editingKey=null; closeModal('addModal'); }
function saveOne(){
  let b=document.getElementById('bales').value.trim(), ty=document.getElementById('type').value, t=document.getElementById('title').value.trim(), f=document.getElementById('formula').value.trim(), plate=document.getElementById('plate').value.trim().toUpperCase(), date=document.getElementById('date').value, bay=document.getElementById('bay').value.trim(), inv=document.getElementById('invoice').value.trim(), st=document.getElementById('status').value;
  if(!b||!t||!f){alert('Fill Bales, Title, Formula'); return} if(!plate){alert('Enter Plate'); return}
  let total=calcTotal(f); if(total===null){alert('Could not calculate'); return} if(Math.abs(total-parseFloat(b))>0.01){alert('❌ Formula = '+total+' Bales = '+b); return}
  let entry={bales:b,type:ty,title:t,formula:f,plate:plate,date:date||'',dateDisplay:date?fmtDate(date):'',bay:bay,invoice:inv,status:st}; entry.id=stableKey(entry);
  if(editingKey && editingKey!==entry.id){ let oi=findByKey(editingKey); if(oi>=0) data.splice(oi,1); }
  let ex=findByKey(entry.id);
  if(ex>=0 && !editingKey){ alert('⚠️ Already saved for this plate + formula + date!'); return; }
  if(ex>=0) data[ex]=entry; else data.unshift(entry);
  editingKey=null; saveLocal(); show(); push(); closeModal('addModal');
}
function clearSearch(){document.getElementById('search').value=''; document.getElementById('statusFilter').value=''; show();}
function showOnlyUnfinished(){document.getElementById('statusFilter').value='unfinished'; document.getElementById('search').value=''; show(); openModal('savedModal');}
function showDates(f){ if(f!==undefined) selectedDate=f; let dates=[...new Set(data.map(d=>d.date).filter(Boolean))].sort().reverse(); let html=dates.map(dt=>`<button class="dateBtn ${selectedDate==dt?'active':''}" onclick="showDates('${dt}')">📅 ${fmtDate(dt)} - ${data.filter(d=>d.date==dt).length}</button>`).join(''); if(data.some(d=>!d.date)) html+=`<button class="dateBtn ${selectedDate=='__NODATE__'?'active':''}" onclick="showDates('__NODATE__')">📅 No Date - ${data.filter(d=>!d.date).length}</button>`; document.getElementById('dateList').innerHTML=html||'<p>No dates</p>'; let res=''; if(selectedDate){ let items=selectedDate=='__NODATE__'?data.filter(d=>!d.date):data.filter(d=>d.date==selectedDate); res='<h4>'+items.length+' car(s)</h4>'+group(items).map(g=>cardHTML(g, openGroups.has(g.key))).join('') } else res='<p class="small">Tap a date</p>'; document.getElementById('dateResults').innerHTML=res; }
function show(){
  let q=(document.getElementById('search').value||'').toLowerCase().trim(), st=document.getElementById('statusFilter').value;
  let unf=data.filter(d=>(d.status||'unfinished')=='unfinished').length;
  document.getElementById('unfTop').innerText='('+unf+')'; document.getElementById('unfBadge').innerText=unf+' unfinished'; document.getElementById('countBadge').innerText=data.length;
  let fl=data.filter(d=>!st||(d.status||'unfinished')==st);
  document.getElementById('list').innerHTML = group(fl).length ? group(fl).map(g=>cardHTML(g, openGroups.has(g.key))).join('') : '<p>No formula</p>';
  showDates(selectedDate);
  if(q||st){ document.getElementById('searchCard').style.display='block'; let mf=data.filter(d=>{let mq=!q||d.bales==q||d.title.toLowerCase().includes(q)||d.formula.toLowerCase().includes(q)||(d.plate||'').toLowerCase().includes(q); let ms=!st||(d.status||'unfinished')==st; return mq&&ms}); document.getElementById('searchResults').innerHTML = mf.length ? group(mf).map(g=>cardHTML(g, true)).join('') : '<p>No result</p>'; } else document.getElementById('searchCard').style.display='none';
}
loadSettings();
let local=null; try{local=JSON.parse(localStorage.getItem('flourData')||'null')}catch(e){local=null}
if(local&&local.formulas) data=local.formulas; else data=[];
data.forEach(d=>{ d.id=stableKey(d); if(!d.status) d.status='unfinished' });
show(); if(localStorage.getItem('ghToken')) pull();
// No service worker caching - always fresh
if('serviceWorker' in navigator){ navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister())); }
</script>
</body>
</html>
